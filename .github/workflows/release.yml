name: Release

# Build an installable WordPress plugin zip and attach it to a GitHub Release
# whenever a version tag (v*) is pushed. The heavy lifting lives in
# scripts/package.mjs (npm run package); this workflow only gates and publishes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the Release and upload the asset

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # scripts/package.mjs uses node:zlib crc32 (Node 20.15+)
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail fast if the pushed tag (v0.4.6) disagrees with package.json (0.4.6).
      # Catches a forgotten version bump or a mistyped tag before anything ships.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump package.json (and php/readme) or retag."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      # Runs `npm run start` (production webpack build) then scripts/package.mjs,
      # emitting build/bws-pdf-viewer-<version>.zip.
      - name: Build installable package
        run: npm run package

      - name: Create release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          files: build/bws-pdf-viewer-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
