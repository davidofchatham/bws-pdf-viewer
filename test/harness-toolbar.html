<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Toolbar harness — feature 002</title>
<link rel="stylesheet" href="/includes/bws-pdf-viewer.css">
<style>
  body { width: 1100px; margin: 0 auto; font-family: sans-serif; }
  .col-narrow { width: 300px; }
  h2 { margin-top: 30px; }
</style>
</head>
<body>
  <h1>Feature 002: integrated toolbar</h1>

  <!-- (a) document mode (native) -->
  <h2>(a) document mode</h2>
  <div id="bws-pdf-doc" class="bws-pdf-viewer-container" style="width: 100%;"
    data-config='{"pdf":"/test/fp.pdf","viewMode":"document","singlepage":true,"layout":"single","bookLayout":"spread","width":"100%","height":"auto","backgroundColor":"#353535","boxColor":"#353535","boxBorder":0,"margin":0.5,"marginTop":null,"marginLeft":null,"breakpoint":768,"enableAnimations":true,"showControls":true,"showFullscreen":true,"showPrint":true,"forceNative":true}'>
    <div class="bws-pdf-viewer-loading"><span>Loading PDF…</span></div>
  </div>

  <!-- (b) flipbook mode -->
  <h2>(b) flipbook mode</h2>
  <div id="bws-pdf-flip" class="bws-pdf-viewer-container" style="width: 100%;"
    data-config='{"pdf":"/test/fp.pdf","viewMode":"flipbook","singlepage":false,"layout":"double","bookLayout":"traditional","width":"100%","height":"auto","backgroundColor":"#353535","boxColor":"#353535","boxBorder":0,"margin":0.5,"marginTop":null,"marginLeft":null,"breakpoint":768,"enableAnimations":false,"showControls":true,"showFullscreen":true,"showPrint":true,"forceNative":null}'>
    <div class="bws-pdf-viewer-loading"><span>Loading PDF…</span></div>
  </div>

  <!-- (c) flipbook in a narrow ~300px column -->
  <h2>(c) flipbook, narrow column</h2>
  <div class="col-narrow">
    <div id="bws-pdf-narrow" class="bws-pdf-viewer-container" style="width: 100%;"
      data-config='{"pdf":"/test/fp.pdf","viewMode":"flipbook","singlepage":false,"layout":"auto","bookLayout":"traditional","width":"100%","height":"auto","backgroundColor":"#353535","boxColor":"#353535","boxBorder":0,"margin":0.5,"marginTop":null,"marginLeft":null,"breakpoint":768,"enableAnimations":false,"showControls":true,"showFullscreen":true,"showPrint":true,"forceNative":null}'>
      <div class="bws-pdf-viewer-loading"><span>Loading PDF…</span></div>
    </div>
  </div>

  <!-- (d) show_controls="false" -->
  <h2>(d) controls disabled</h2>
  <div id="bws-pdf-nocontrols" class="bws-pdf-viewer-container" style="width: 100%;"
    data-config='{"pdf":"/test/fp.pdf","viewMode":"flipbook","singlepage":false,"layout":"double","bookLayout":"traditional","width":"100%","height":"auto","backgroundColor":"#353535","boxColor":"#353535","boxBorder":0,"margin":0.5,"marginTop":null,"marginLeft":null,"breakpoint":768,"enableAnimations":false,"showControls":false,"showFullscreen":true,"showPrint":true,"forceNative":null}'>
    <div class="bws-pdf-viewer-loading"><span>Loading PDF…</span></div>
  </div>

  <!-- (e) flipbook, spread layout (book_layout="spread") -->
  <h2>(e) flipbook, spread layout</h2>
  <div id="bws-pdf-spread" class="bws-pdf-viewer-container" style="width: 100%;"
    data-config='{"pdf":"/test/fp.pdf","viewMode":"flipbook","singlepage":false,"layout":"double","bookLayout":"spread","width":"100%","height":"auto","backgroundColor":"#353535","boxColor":"#353535","boxBorder":0,"margin":0.5,"marginTop":null,"marginLeft":null,"breakpoint":768,"enableAnimations":false,"showControls":true,"showFullscreen":true,"showPrint":true,"forceNative":null}'>
    <div class="bws-pdf-viewer-loading"><span>Loading PDF…</span></div>
  </div>

  <script src="/dist/pdf.js"></script>
  <script src="/dist/bws-viewer-engines.js"></script>
  <script src="/includes/bws-pdf-viewer.js"></script>
</body>
</html>
